<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مفيش اتصال بالإنترنت</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: #212529;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 24px;
        }
        .box { max-width: 360px; }
        h1 { font-size: 1.4rem; margin-bottom: 8px; }
        p { color: #adb5bd; }
        button {
            margin-top: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #ffc107;
            color: #212529;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <div style="font-size:48px">📶</div>
        <h1>مفيش اتصال بالإنترنت دلوقتي</h1>
        <p>اتأكد إن النت شغال عندك وحاول تاني.</p>
        <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
</body>
</html>
