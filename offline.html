<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#B8862B" />
    <title>مفيش اتصال بالإنترنت</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: #FFF8EC;
            color: #2B1D10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 24px;
        }
        .box { max-width: 360px; }
        h1 { font-size: 1.4rem; margin-bottom: 8px; color: #8F6616; }
        p { color: #7A6650; }
        button {
            margin-top: 16px;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #C8321E, #E2552F);
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <div style="font-size:48px">📶</div>
        <h1>مفيش اتصال بالإنترنت دلوقتي</h1>
        <p>اتأكد إن النت شغال عندك وحاول تاني.</p>
        <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
</body>
</html>
